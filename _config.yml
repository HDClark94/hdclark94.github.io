# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Dr Harry Clark # the website title (if blank, full name will be used instead)
first_name: Dr
middle_name: Harry
last_name: Clark
email: harrydclark91@gmail.com
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  Systems neuroscience researcher at the Medical University of Vienna, studying
  spatial cognition with in-vivo electrophysiology and computational modelling.
footer_text: >
keywords: neuroscience, spatial cognition, grid cells, entorhinal cortex, electrophysiology, computational modelling
lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon: brain_icon.png # the emoji used as the favicon (alternatively, provide image name in /assets/img/)
url: https://hdclark94.github.io # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/. Leave blank for root
last_updated: false # set to true if you want to display last updated in the footer
impressum_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: False

# Dimensions
max_width: 800px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
# see https://schema.org/docs/faq.html for more information
